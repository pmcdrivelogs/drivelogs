<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Part - Drive Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 50%, #fef3c7 100%);
    }
    
    .form-container {
      background: white;
      border-radius: 16px;
      padding: 32px 40px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
      border: 2px solid #d1d5db;
    }
    
    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
    }
    
    .form-label {
      font-weight: 700;
      color: #1f2937;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      min-width: 180px;
    }
    
    .colon {
      font-weight: bold;
      color: #1f2937;
      margin: 0 16px;
      font-size: 1.1rem;
    }
    
    .form-input, .form-select {
      flex: 1;
      padding: 12px 18px;
      border: 2px solid #10b981;
      border-radius: 30px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: white;
    }
    
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    
    .form-input[readonly] {
      background-color: #f0fdf4;
      cursor: not-allowed;
      color: #166534;
      font-weight: 600;
    }
    
    .submit-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 16px 56px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      margin-right: 12px;
    }
    
    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.45);
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
    }
    
    .cancel-btn {
      background: #64748b;
      color: white;
      padding: 16px 56px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      box-shadow: 0 6px 20px rgba(100, 116, 139, 0.35);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    
    .cancel-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(100, 116, 139, 0.45);
      background: #475569;
    }
    
    .form-title {
      color: #059669;
      font-size: 1.75rem;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 3px;
    }
    
    .form-ref {
      color: #374151;
      font-weight: 700;
      font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
      .form-container {
        padding: 24px 20px;
      }
      
      .form-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      
      .form-label {
        min-width: auto;
      }
      
      .colon {
        display: none;
      }
      
      .form-input, .form-select {
        width: 100%;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pt-20">
  
  <!-- Logo Bar -->
  <div class="logo-bar w-full flex items-center justify-between px-4 py-3 fixed top-0 left-0 z-50">
    <img src="{{ url_for('static', filename='img/drive-logs.png') }}" alt="Drive Logs Logo" class="h-12 md:h-14 w-auto ml-2">
    <div class="flex items-center gap-4">
      <a href="{{ url_for('part_generator') }}" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition-colors">
        ← Back
      </a>
      <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition-colors">
        Logout
      </a>
    </div>
  </div>

  <!-- College Header -->
  <div class="w-full flex justify-center items-center border-b border-gray-300 bg-white">
    <img src="{{ url_for('static', filename='img/pmc-logo.png') }}" alt="College Header" class="w-full max-w-5xl h-auto p-2 md:p-4">
  </div>

  <!-- Main Content -->
  <div class="flex-1 py-8 px-4">
    <div class="form-container w-full max-w-5xl mx-auto">
      
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 p-4 rounded-lg {% if category == 'success' %}bg-green-100 text-green-800 border border-green-300{% elif category == 'danger' %}bg-red-100 text-red-800 border border-red-300{% else %}bg-blue-100 text-blue-800 border border-blue-300{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      
      <!-- Header -->
      <div class="text-center mb-2">
        <h1 class="form-title">EDIT PART</h1>
      </div>
      <div class="text-right mb-6">
        <span class="form-ref">REF: PMCTECH/LOGI/PARTS</span>
      </div>

      <!-- Form -->
      <form method="POST">
        
        <!-- Part ID (Editable) -->
        <div class="form-row">
          <label class="form-label">PART ID</label>
          <span class="colon">:</span>
          <input type="text" name="part_id" class="form-input" value="{{ part.part_id }}" required placeholder="Enter part ID">
        </div>

        <!-- Part Name -->
        <div class="form-row">
          <label class="form-label">PART NAME</label>
          <span class="colon">:</span>
          <input type="text" name="part_name" class="form-input" required value="{{ part.part_name }}" placeholder="Enter part name">
        </div>

        <!-- Category -->
        <div class="form-row">
          <label class="form-label">CATEGORY</label>
          <span class="colon">:</span>
          <select name="category" class="form-select">
            <option value="">-- Select Category --</option>
            <option value="Engine Parts" {% if part.category == 'Engine Parts' %}selected{% endif %}>Engine Parts</option>
            <option value="Brake System" {% if part.category == 'Brake System' %}selected{% endif %}>Brake System</option>
            <option value="Electrical" {% if part.category == 'Electrical' %}selected{% endif %}>Electrical</option>
            <option value="Suspension" {% if part.category == 'Suspension' %}selected{% endif %}>Suspension</option>
            <option value="Transmission" {% if part.category == 'Transmission' %}selected{% endif %}>Transmission</option>
            <option value="Body Parts" {% if part.category == 'Body Parts' %}selected{% endif %}>Body Parts</option>
            <option value="Filters" {% if part.category == 'Filters' %}selected{% endif %}>Filters</option>
            <option value="Lubricants" {% if part.category == 'Lubricants' %}selected{% endif %}>Lubricants</option>
            <option value="Tyres" {% if part.category == 'Tyres' %}selected{% endif %}>Tyres</option>
            <option value="Consumables" {% if part.category == 'Consumables' %}selected{% endif %}>Consumables</option>
            <option value="Others" {% if part.category == 'Others' %}selected{% endif %}>Others</option>
          </select>
        </div>

        <!-- Unit -->
        <div class="form-row">
          <label class="form-label">UNIT</label>
          <span class="colon">:</span>
          <select name="unit" class="form-select">
            <option value="Nos" {% if part.unit == 'Nos' %}selected{% endif %}>Nos (Numbers)</option>
            <option value="Liters" {% if part.unit == 'Liters' %}selected{% endif %}>Liters</option>
            <option value="Kg" {% if part.unit == 'Kg' %}selected{% endif %}>Kg (Kilograms)</option>
            <option value="Sets" {% if part.unit == 'Sets' %}selected{% endif %}>Sets</option>
            <option value="Pairs" {% if part.unit == 'Pairs' %}selected{% endif %}>Pairs</option>
            <option value="Meters" {% if part.unit == 'Meters' %}selected{% endif %}>Meters</option>
          </select>
        </div>

        <!-- Description -->
        <div class="form-row">
          <label class="form-label">DESCRIPTION</label>
          <span class="colon">:</span>
          <input type="text" name="description" class="form-input" value="{{ part.description or '' }}" placeholder="Enter description (optional)">
        </div>

        <!-- Status -->
        <div class="form-row">
          <label class="form-label">STATUS</label>
          <span class="colon">:</span>
          <select name="status" class="form-select">
            <option value="active" {% if part.status == 'active' %}selected{% endif %}>Active</option>
            <option value="inactive" {% if part.status == 'inactive' %}selected{% endif %}>Inactive</option>
          </select>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-center gap-4 mt-10">
          <button type="submit" class="submit-btn">
            Update Part
          </button>
          <a href="{{ url_for('part_generator') }}" class="cancel-btn">
            Cancel
          </a>
        </div>
      </form>
      
    </div>
  </div>

<script src="{{ url_for('static', filename='js/uppercase.js') }}"></script>
{% include 'footer.html' %}
</body>
</html>
