<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User - Drive Logs Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- Header -->
  <div class="bg-yellow-600 text-white p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">✏️ Edit User</h1>
        <p class="text-sm">Editing: {{ user.full_name }}</p>
      </div>
      <div class="flex items-center gap-4">
        <a href="{{ url_for('admin_users') }}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-4 py-2 rounded-full font-semibold transition-colors">
          ← Back to Users
        </a>
        <a href="{{ url_for('logout') }}" class="bg-white text-yellow-700 px-4 py-2 rounded-full font-semibold hover:bg-gray-100 transition-colors">
          Logout
        </a>
      </div>
    </div>
  </div>

  <!-- Flash Messages -->
  <div class="container mx-auto px-4 mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-4 rounded-lg {% if category == 'success' %}bg-green-100 text-green-800 border border-green-300{% elif category == 'danger' %}bg-red-100 text-red-800 border border-red-300{% else %}bg-blue-100 text-blue-800 border border-blue-300{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <!-- Main Content -->
  <div class="container mx-auto p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6 md:p-8">
      <form method="POST" action="{{ url_for('admin_edit_user', user_id=user.id) }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Full Name -->
          <div class="md:col-span-2">
            <label class="block text-gray-700 font-bold mb-2">Full Name *</label>
            <input type="text" name="full_name" required value="{{ user.full_name }}" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
          </div>

          <!-- Email -->
          <div>
            <label class="block text-gray-700 font-bold mb-2">Email *</label>
            <input type="email" name="email" required value="{{ user.email }}" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
          </div>

          <!-- Password -->
          <div>
            <label class="block text-gray-700 font-bold mb-2">New Password (leave blank to keep current)</label>
            <input type="password" name="password" minlength="6" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none" placeholder="Enter new password">
          </div>

          <!-- Phone -->
          <div>
            <label class="block text-gray-700 font-bold mb-2">Phone</label>
            <input type="text" name="phone" value="{{ user.phone or '' }}" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
          </div>

          <!-- Department -->
          <div>
            <label class="block text-gray-700 font-bold mb-2">Department</label>
            <input type="text" name="department" value="{{ user.department or '' }}" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
          </div>

          <!-- Role -->
          <div>
            <label class="block text-gray-700 font-bold mb-2">Role *</label>
            <select name="role" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
              <option value="user" {% if user.role == 'user' %}selected{% endif %}>User</option>
              <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
          </div>

          <!-- Is Active -->
          <div>
            <label class="block text-gray-700 font-bold mb-2">Status</label>
            <select name="is_active" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none">
              <option value="true" {% if user.is_active %}selected{% endif %}>Active</option>
              <option value="false" {% if not user.is_active %}selected{% endif %}>Inactive</option>
            </select>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="mt-8 flex justify-center gap-4">
          <a href="{{ url_for('admin_users') }}" class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-lg font-bold transition-colors">
            Cancel
          </a>
          <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-lg font-bold transition-colors">
            Update User
          </button>
        </div>
      </form>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/uppercase.js') }}"></script>
{% include 'footer.html' %}
</body>
</html>
