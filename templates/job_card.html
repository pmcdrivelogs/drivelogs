<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Card - Drive Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    // Store vehicle selection in sessionStorage to share across job card pages
    function updateVehicleData() {
      const vehicleId = document.querySelector('select[name="vehicle_id"]').value;
      const registrationNo = document.querySelector('input[name="registration_no"]').value;
      
      if (vehicleId) {
        sessionStorage.setItem('job_card_vehicle_id', vehicleId);
      }
      if (registrationNo) {
        sessionStorage.setItem('job_card_registration_no', registrationNo);
      }
    }
    
    // Restore vehicle data on page load
    document.addEventListener('DOMContentLoaded', function() {
      const savedVehicleId = sessionStorage.getItem('job_card_vehicle_id');
      const savedRegistrationNo = sessionStorage.getItem('job_card_registration_no');
      
      if (savedVehicleId) {
        document.querySelector('select[name="vehicle_id"]').value = savedVehicleId;
      }
      if (savedRegistrationNo) {
        document.querySelector('input[name="registration_no"]').value = savedRegistrationNo;
      }
      
      // Convert registration number to uppercase
      const regInput = document.querySelector('input[name="registration_no"]');
      if (regInput) {
        regInput.addEventListener('input', function(e) {
          this.value = this.value.toUpperCase();
        });
      }
      
      // Update storage when fields change
      document.querySelector('select[name="vehicle_id"]').addEventListener('change', updateVehicleData);
      document.querySelector('input[name="registration_no"]').addEventListener('input', updateVehicleData);
    });
  </script>
  <style>
    .job-card-btn {
      background: linear-gradient(#1e3a8a);
      color: white;
      padding: 1.5rem 3rem;
      border-radius: 50px;
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(47, 58, 127, 0.3);
      border: none;  
      display: block;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    .job-card-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(34, 197, 94, 0.5);
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    }
    .job-card-btn:active {
      transform: translateY(-1px);
    }
    input[name="registration_no"] {
      text-transform: uppercase;
    }
  </style>
</head>
<body class="bg-[#fcfcfc] min-h-screen flex flex-col pt-20">
  <!-- Logo Bar -->
  <div class="logo-bar w-full flex items-center justify-between px-4 py-3 fixed top-0 left-0 z-50">
    <img src="{{ url_for('static', filename='img/drive-logs.png') }}" alt="Drive Logs Logo" class="h-12 md:h-14 w-auto ml-2">
    <div class="flex items-center gap-4">
      <a href="{{ url_for('home') }}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-4 py-2 rounded-full text-sm font-semibold transition-colors">
        ← Back to Home
      </a>
      <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition-colors">
        Logout
      </a>
    </div>
  </div>

  <!-- College Header -->
  <div class="w-full flex justify-center items-center border-b border-gray-300 bg-white">
    <img src="{{ url_for('static', filename='img/pmc-logo.png') }}" alt="College Header" class="w-full max-w-5xl h-auto p-2 md:p-4">
  </div>

  <!-- Main Content -->
  <div class="flex-1 py-6 px-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-5xl mx-auto p-6 md:p-12 border-2 border-gray-200">
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 p-4 rounded-lg {% if category == 'success' %}bg-green-100 text-green-800 border border-green-300{% elif category == 'danger' %}bg-red-100 text-red-800 border border-red-300{% else %}bg-blue-100 text-blue-800 border border-blue-300{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      
      <!-- Header -->
      <div class="text-center mb-8 pb-6 border-b-2 border-gray-300">
        <h1 class="text-3xl md:text-4xl font-bold text-blue-900">JOB CARD</h1>
      </div>


      <!-- Job Card Options -->
      <div class="flex flex-col gap-8 mt-12">
        <a href="{{ url_for('driver_voice') }}" class="job-card-btn">
          DRIVER'S VOICE
        </a>
        
        <a href="{{ url_for('technician_observation') }}" class="job-card-btn">
          TECHNICIAN OBSERVATION
        </a>
        
        <a href="{{ url_for('process_of_works') }}" class="job-card-btn">
          PROCESS OF WORKS
        </a>
      </div>

    </div>
  </div>

<script src="{{ url_for('static', filename='js/uppercase.js') }}"></script>
{% include 'footer.html' %}
</body>
</html>
