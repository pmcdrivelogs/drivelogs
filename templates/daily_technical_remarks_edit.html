<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Daily Technical Remark</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-[#fcfcfc] min-h-screen flex flex-col pt-20">
  <div class="logo-bar w-full flex items-center justify-between px-2 py-1 fixed top-0 left-0 z-50">
    <img src="{{ url_for('static', filename='img/drive-logs.png') }}" alt="Drive Logs Logo" class="h-12 md:h-14 w-auto ml-2">
    <div class="flex items-center gap-4">
      <a href="{{ url_for('daily_technical_remarks_history') }}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-4 py-2 rounded-full text-sm font-semibold transition-colors">← Back</a>
    </div>
  </div>

  <div class="flex-1 py-6 px-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-3xl mx-auto p-6 md:p-8 border-2 border-gray-200">
      <h1 class="text-2xl font-bold mb-4">Edit Daily Technical Remark</h1>
      <form method="post" action="{{ url_for('edit_daily_technical_remark', remark_id=record.id) }}">
        <div class="grid grid-cols-1 gap-3">
          <label class="text-sm">Date</label>
          <input name="date" type="date" value="{{ record.date or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Vehicle ID</label>
          <input name="vehicle_id" type="text" value="{{ record.vehicle_id or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Registration No</label>
          <input name="registration_no" type="text" value="{{ record.registration_no or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Current Kilometer</label>
          <input name="kilometer" type="text" value="{{ record.kilometer or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Driver's Voice</label>
          <textarea name="drivers_voice" class="border rounded px-3 py-2 text-sm">{{ record.drivers_voice or '' }}</textarea>

          <label class="text-sm">Technical Advisor's Observation & Action</label>
          <textarea name="technical_observation" class="border rounded px-3 py-2 text-sm">{{ record.technical_observation or '' }}</textarea>

          <label class="text-sm">Day-end Status</label>
          <input name="day_end_status" type="text" value="{{ record.day_end_status or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Materials Purchased</label>
          <input name="materials_purchased" type="text" value="{{ record.materials_purchased or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Supplier / Bill</label>
          <input name="supplier_bill" type="text" value="{{ record.supplier_bill or '' }}" class="border rounded px-3 py-2 text-sm">

          <label class="text-sm">Amount</label>
          <input name="amount" type="number" step="0.01" value="{{ record.amount or '' }}" class="border rounded px-3 py-2 text-sm">

          <div class="flex items-center gap-3 pt-3">
            <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded">Save changes</button>
            <a href="{{ url_for('daily_technical_remarks_history') }}" class="px-4 py-2 bg-gray-200 rounded">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
  <script>
    // Disable submit button to prevent double-submit while saving
    document.addEventListener('DOMContentLoaded', function(){
      const form = document.querySelector('form');
      if (!form) return;
      const submit = form.querySelector('button[type="submit"]');
      form.addEventListener('submit', function(e){
        if (!submit) return;
        submit.disabled = true;
        // show a simple working indicator
        const original = submit.innerText;
        submit.innerText = 'Saving...';
        // In case client-side validation prevents submission, re-enable after a short timeout
        setTimeout(()=>{ try{ if (!form._submitted) { submit.disabled = false; submit.innerText = original } } catch(e){} }, 5000);
        // mark submitted; server redirect will navigate away
        form._submitted = true;
      });
    });
  </script>
</body>
</html>
