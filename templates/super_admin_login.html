<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Logs - Super Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen flex flex-col bg-white from-slate-50 to-slate-100">
    <main class="flex-1 w-full flex items-center justify-center p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="fixed top-4 right-4 z-50">
                {% for category, message in messages %}
                    <div class="bg-{{ 'green' if category == 'success' else 'red' if category == 'danger' else 'yellow' }}-100 border border-{{ 'green' if category == 'success' else 'red' if category == 'danger' else 'yellow' }}-400 text-{{ 'green' if category == 'success' else 'red' if category == 'danger' else 'yellow' }}-700 px-4 py-3 rounded mb-2" role="alert">
                        <span class="block sm:inline">{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="w-full max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-center gap-0 md:gap-8">
        <!-- Left Side - Bus Image and Logo -->
        <div class="flex flex-col items-center justify-center w-full md:w-1/2 mb-8 md:mb-0">
            <div class="mb-6 w-full flex flex-col items-center">
                <div class="">
                    <img src="{{ url_for('static', filename='img/bus-logo.png') }}" alt="DRIVE LOGS Logo" class="w-[600px] md:w-[600px] h-auto block">
                </div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="w-full md:w-1/2 flex items-center justify-center">
            <div class="bg-white rounded-[28px] shadow-2xl p-6 sm:p-8 md:p-10 w-full max-w-md border-2 border-red-200">
                <!-- Welcome Header -->
                <div class="mb-8">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-2xl">🔐</span>
                        <p class="text-red-600 text-base md:text-lg font-bold mb-0">ADMIN</p>
                    </div>
                    <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-900 mb-6 leading-tight">WELCOME TO<br>DRIVE LOGS</h2>
                </div>

                <!-- Login Form -->
                <form method="POST" action="{{ url_for('super_admin_login') }}">
                    <div class="mb-6">
                        <input 
                            type="text" 
                            name="email"
                            id="adminEmail" 
                            placeholder="Email or Username" 
                            class="w-full px-5 py-3 md:px-6 md:py-4 rounded-full border-2 border-red-300 text-gray-700 placeholder-gray-400 focus:border-red-500 transition-all text-base md:text-lg"
                            required
                        >
                    </div>
                    <div class="mb-8 relative">
                        <div class="relative">
                            <input 
                                type="password" 
                                name="password"
                                id="adminPassword" 
                                placeholder="Admin Password" 
                                class="w-full px-5 py-3 md:px-6 md:py-4 pr-14 rounded-full border-2 border-red-300 text-gray-700 placeholder-gray-400 focus:border-red-500 transition-all text-base md:text-lg"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle absolute right-4 md:right-5 top-1/2 transform -translate-y-1/2 text-xl md:text-2xl"
                                onclick="toggleAdminPasswordVisibility()"
                                id="adminToggleBtn"
                                title="Toggle password visibility"
                            >
                                👁️
                            </button>
                        </div>
                    </div>
                    <button 
                        type="submit" 
                        class="admin-login-btn w-full py-3 md:py-4 rounded-full font-bold text-lg text-white shadow-lg hover:shadow-xl active:shadow-md tracking-wide"
                    >
                        ADMIN LOGIN
                    </button>
                </form>

                <!-- Back to User Login Link -->
                <div class="mt-6 text-center">
                    <a href="{{ url_for('login') }}" class="text-gray-600 hover:text-red-600 text-sm font-semibold transition-colors">
                        ← Back to User Login
                    </a>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% include 'footer.html' %}

</body>
</html>
