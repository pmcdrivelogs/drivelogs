<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback - Drive Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    function handleFeedbackSubmit(event) {
      const form = event.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3 inline-block" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Submitting...';
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      
      return true;
    }
  </script>
</head>
<body class="bg-[#fcfcfc] min-h-screen flex flex-col pt-20">
  <!-- Logo Bar -->
  <div class="logo-bar w-full flex items-center justify-between px-4 py-3 fixed top-0 left-0 z-50">
    <img src="{{ url_for('static', filename='img/drive-logs.png') }}" alt="Drive Logs Logo" class="h-12 md:h-14 w-auto ml-2">
    <div class="flex items-center gap-4">
      <a href="{{ url_for('home') }}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-4 py-2 rounded-full text-sm font-semibold transition-colors">
        ← Back to Home
      </a>
      <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-full text-sm font-semibold transition-colors">
        Logout
      </a>
    </div>
  </div>

  <!-- College Header -->
  <div class="w-full flex justify-center items-center border-b border-gray-300 bg-white">
    <img src="{{ url_for('static', filename='img/pmc-logo.png') }}" alt="College Header" class="w-full max-w-5xl h-auto p-2 md:p-4">
  </div>

  <!-- Main Content -->
  <div class="flex-1 py-6 px-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-4xl mx-auto p-6 md:p-8 border-2 border-gray-200">
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="mb-4 p-4 rounded-lg {% if category == 'success' %}bg-green-100 text-green-800 border border-green-300{% elif category == 'danger' %}bg-red-100 text-red-800 border border-red-300{% else %}bg-blue-100 text-blue-800 border border-blue-300{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      
      <!-- Header -->
      <div class="text-center mb-6 pb-4 border-b-2 border-gray-300">
        <h1 class="text-2xl md:text-3xl font-bold text-blue-900">FEEDBACK</h1>
        <p class="text-gray-600 mt-2">We value your feedback to improve our Drive Logs system</p>
      </div>

      <!-- Feedback Form -->
      <form method="POST" action="{{ url_for('feedback_submit') }}" onsubmit="return handleFeedbackSubmit(event)">
        
        <!-- Personal Information -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block font-bold text-gray-900 mb-2">NAME: <span class="text-red-500">*</span></label>
            <input type="text" name="name" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Enter your name">
          </div>
          
          <div>
            <label class="block font-bold text-gray-900 mb-2">EMAIL: <span class="text-red-500">*</span></label>
            <input type="email" name="email" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Enter your email">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div>
            <label class="block font-bold text-gray-900 mb-2">CONTACT NUMBER:</label>
            <input type="tel" name="contact" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Enter contact number">
          </div>
          
          <div>
            <label class="block font-bold text-gray-900 mb-2">DEPARTMENT/ROLE:</label>
            <input type="text" name="department" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Enter your department or role">
          </div>
        </div>

        <!-- Feedback Details -->
        <div class="mb-6">
          <label class="block font-bold text-gray-900 mb-2">FEEDBACK TYPE: <span class="text-red-500">*</span></label>
          <select name="feedback_type" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
            <option value="">Select Feedback Type</option>
            <option value="Suggestion">Suggestion</option>
            <option value="Complaint">Complaint</option>
            <option value="Appreciation">Appreciation</option>
            <option value="Bug Report">Bug Report</option>
            <option value="Feature Request">Feature Request</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-6">
          <label class="block font-bold text-gray-900 mb-2">SUBJECT: <span class="text-red-500">*</span></label>
          <input type="text" name="subject" required class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Enter feedback subject">
        </div>

        <div class="mb-6">
          <label class="block font-bold text-gray-900 mb-2">MESSAGE: <span class="text-red-500">*</span></label>
          <textarea name="message" required rows="6" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200" placeholder="Enter your detailed feedback here..."></textarea>
        </div>

        <!-- Rating -->
        <div class="mb-8">
          <label class="block font-bold text-gray-900 mb-2">OVERALL RATING (Optional):</label>
          <div class="flex gap-4 items-center">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="rating" value="5" class="w-4 h-4">
              <span>⭐⭐⭐⭐⭐ Excellent</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="rating" value="4" class="w-4 h-4">
              <span>⭐⭐⭐⭐ Good</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="rating" value="3" class="w-4 h-4">
              <span>⭐⭐⭐ Average</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="rating" value="2" class="w-4 h-4">
              <span>⭐⭐ Poor</span>
            </label>
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="radio" name="rating" value="1" class="w-4 h-4">
              <span>⭐ Very Poor</span>
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-center">
          <button type="submit" class="bg-blue-800 hover:bg-green-600 text-white px-12 py-3 rounded-full font-bold text-lg shadow-lg transition-colors">
            Submit Feedback
          </button>
        </div>
      </form>
    </div>
  </div>

<script src="{{ url_for('static', filename='js/uppercase.js') }}"></script>
{% include 'footer.html' %}
</body>
</html>
