services:
  - type: web
    name: drivelogs-web
    env: python
    pythonVersion: "3.11.9"
    # Simple build: create a venv and install requirements using the venv python
    buildCommand: "/bin/bash -lc \"python3 -m venv .venv && .venv/bin/python -m pip install --upgrade pip setuptools wheel && .venv/bin/python -m pip install -r requirements.txt\""
    # Diagnostic start: print env, sys.path and site-packages contents before starting Gunicorn
      startCommand: "/bin/bash -lc \".venv/bin/python -m pip install --upgrade setuptools wheel && exec .venv/bin/python -m gunicorn app:app --bind 0.0.0.0:$PORT\""
    branch: main
