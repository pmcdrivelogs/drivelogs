<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Logs - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo-bg {
            background-color: #FFD700;
        }
        
        .login-btn {
            background-color: #DC2626;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background-color: #B91C1C;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        input::placeholder {
            color: #999;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        
        .password-toggle {
            cursor: pointer;
            color: #999;
            transition: color 0.3s ease;
        }
        
        .password-toggle:hover {
            color: #666;
        }
    </style>
</head>
<body class="from-slate-50 to-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-center gap-0 md:gap-8">
        <!-- Left Side - Bus Image and Logo -->
        <div class="flex flex-col items-center justify-center w-full md:w-1/2 mb-8 md:mb-0">
            <div class="mb-6 w-full flex flex-col items-center">
                <div class="">
                    <img src="./img/login  bus.png" alt="DRIVE LOGS Logo" class="w-[600px] md:w-[600px] h-auto block">
                </div>
            </div>
        </div>

        <!-- Right Side - Login Form -->
        <div class="w-full md:w-1/2 flex items-center justify-center">
            <div class="bg-white rounded-[28px] shadow-2xl p-6 sm:p-8 md:p-10 w-full max-w-md border-2 border-red-200">
                <!-- Welcome Header -->
                <div class="mb-8">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-2xl">🔐</span>
                        <p class="text-red-600 text-base md:text-lg font-bold mb-0"> ADMIN</p>
                    </div>
                    <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-900 mb-6 leading-tight">SECURE ACCESS<br>CONTROL PANEL</h2>
                </div>

                <!-- Login Form -->
                <form id="superAdminForm">
                    <div class="mb-6">
                        <input 
                            type="text" 
                            id="adminUsername" 
                            placeholder="Admin Username" 
                            class="w-full px-5 py-3 md:px-6 md:py-4 rounded-full border-2 border-red-300 text-gray-700 placeholder-gray-400 focus:border-red-500 transition-all text-base md:text-lg"
                            required
                        >
                    </div>
                    <div class="mb-8 relative">
                        <div class="relative">
                            <input 
                                type="password" 
                                id="adminPassword" 
                                placeholder="Admin Password" 
                                class="w-full px-5 py-3 md:px-6 md:py-4 pr-14 rounded-full border-2 border-red-300 text-gray-700 placeholder-gray-400 focus:border-red-500 transition-all text-base md:text-lg"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle absolute right-4 md:right-5 top-1/2 transform -translate-y-1/2 text-xl md:text-2xl"
                                onclick="toggleAdminPasswordVisibility()"
                                id="adminToggleBtn"
                                title="Toggle password visibility"
                            >
                                👁️
                            </button>
                        </div>
                    </div>
                    <button 
                        type="submit" 
                        class="login-btn w-full py-3 md:py-4 rounded-full font-bold text-lg text-white shadow-lg hover:shadow-xl active:shadow-md tracking-wide"
                    >
                        ADMIN LOGIN
                    </button>
                </form>

                <!-- Back to User Login Link -->
                <div class="mt-6 text-center">
                    <a href="index.html" class="text-gray-600 hover:text-red-600 text-sm font-semibold transition-colors">
                        ← Back to User Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle password visibility for super admin
        function toggleAdminPasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleBtn = document.getElementById('adminToggleBtn');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Handle super admin login
        const adminForm = document.getElementById('superAdminForm');
        if (adminForm) {
            adminForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('adminUsername').value;
                const password = document.getElementById('adminPassword').value;
                
                // You can add your authentication logic here
                alert('Super Admin Login - Username: ' + username);
                
                // Redirect to admin dashboard (you'll create this later)
                // window.location.href = 'admin-dashboard.html';
            });
        }
    </script>
</body>
</html>
